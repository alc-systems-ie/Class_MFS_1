# Bench diagnostic: log every 128-bit service UUID heard, timestamped, on the UART
# console. Continuous passive scan, so nothing the phone sends is missed.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_BT_LOG_LEVEL_WRN=y
