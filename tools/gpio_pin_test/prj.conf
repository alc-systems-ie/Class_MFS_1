# Bench pin test — nRF54L15 DK.
#
# Deliberately minimal: GPIO and logging only. No BLE, no crypto, no settings.

CONFIG_CPP=y
CONFIG_STD_CPP20=y

CONFIG_GPIO=y

# The debounce handler logs from the system workqueue, and immediate-mode
# logging formats on the calling stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# RTT logging (house style). Swap CONFIG_LOG_BACKEND_RTT for
# CONFIG_LOG_BACKEND_UART if you would rather watch this on the DK's VCOM 1.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
