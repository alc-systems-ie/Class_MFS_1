# Hello world over RTT — first bring-up check for a new CLASS MFS board.
#
# Deliberately minimal: logging only. No BLE, no crypto, no settings.

CONFIG_CPP=y
CONFIG_STD_CPP20=y

# RTT logging (house style). Immediate mode so nothing is lost if the board resets.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
