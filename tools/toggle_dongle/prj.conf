# Bench advertiser for MFS_1's engineer toggle. See README.md.
#
# Deliberately minimal: no USB, no console, no logging. The LED is the only
# feedback needed for a button-press tool, and USB CDC on the Dongle needs
# usb_enable() plumbing that buys nothing here.

CONFIG_CPP=y
CONFIG_STD_CPP20=y

CONFIG_GPIO=y

# BLE broadcaster only - this tool never scans and never connects.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="MFS1-Toggle"

CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_MAIN_STACK_SIZE=2048
