# Range test, pong side - CLASS MFS_1 hardware. See ../range_ping/README.md.

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_GPIO=y

# The nPM2100 boot monitor must be stopped over I2C or it resets the SoC ~9 s
# after boot (see ../../src/app.cpp App::initPmic()).
CONFIG_I2C=y

# Observer (pings) and broadcaster (pongs), extended advertising on the Coded PHY.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_EXT_ADV_CODING_SELECTION=y
CONFIG_BT_DEVICE_NAME="MFS1-RangePong"
CONFIG_BT_RX_STACK_SIZE=2048

# nRF21540 FEM, driven by MPSL: PA on transmit, LNA (+13 dB) on receive. POUTB
# (+10 dB) as alc_drawer_master, for Irish EIRP compliance: the controller splits
# the requested +10 dBm into 0 dBm from the SoC plus 10 dB from the FEM.
# Without this the FEM sits powered down in the RF path and both directions suffer.
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO_SPI=y
CONFIG_MPSL_FEM_NRF21540_TX_GAIN_DB=10
CONFIG_BT_CTLR_TX_PWR_ANTENNA=10

# The DK console UART (uart20) sits on P1.04 / P1.05 = the nPM2100 I2C bus here.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# RTT logging (house style).
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_MAIN_STACK_SIZE=2048
