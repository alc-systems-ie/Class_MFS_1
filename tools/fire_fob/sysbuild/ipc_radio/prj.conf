# Thingy:53 network core (ipc_radio, HCI over IPC) for the fire fob.
#
# This file REPLACES ipc_radio's own prj.conf, so it restates the HCI IPC base
# configuration (as tools/range_ping) before adding the fob's settings.
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_ASSERT=y

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Three advertising sets (one FIRE per MFS, overlapping) while scanning for the
# confirmations.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_SET=3

# nRF21540 at POUTB (+10 dB), GPIO mode (the Thingy:53 board disables its SPI):
# 0 dBm from the nRF5340 + 10 dB = +10 dBm, within the Irish EIRP allocation (as
# the MFS). Not POUTA: tools/range_ping's +20 dBm is bench-only.
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO=y
CONFIG_MPSL_FEM_NRF21540_TX_GAIN_DB=10
CONFIG_BT_CTLR_TX_PWR_ANTENNA=10
