# OPT3001 ambient light sensor bring-up for the CLASS MFS_1 hardware.
#
# Minimal: I2C and logging. No BLE, no settings, no credentials.

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_GPIO=y
CONFIG_I2C=y

# The DK console UART (uart20) sits on P1.04 / P1.05 = the nPM2100 I2C bus here.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# RTT logging (house style).
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
