# Range test, ping side - Thingy:53 application core. See README.md.
#
# The radio, Coded PHY support and the nRF21540 FEM gain are configured on the
# NETWORK core: sysbuild/ipc_radio/prj.conf.

CONFIG_CPP=y
CONFIG_STD_CPP20=y

CONFIG_GPIO=y

# Broadcaster (pings) and observer (pongs) at once, extended advertising on the
# Coded PHY, S8 coding requested explicitly.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_CODING_SELECTION=y
CONFIG_BT_DEVICE_NAME="MFS1-RangePing"
CONFIG_BT_RX_STACK_SIZE=2048

# Logging to the Thingy:53 USB CDC ACM serial port (the board enables it). Deferred
# mode, so an unplugged USB cable never stalls the ping loop in the field.
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

CONFIG_MAIN_STACK_SIZE=2048
