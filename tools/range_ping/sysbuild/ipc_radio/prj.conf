# Thingy:53 network core (ipc_radio, HCI over IPC) for the range test.
#
# This file REPLACES ipc_radio's own prj.conf, so it restates the HCI IPC base
# configuration (nrf/applications/ipc_radio/prj.conf + overlay-bt_hci_ipc.conf)
# before adding the range-test settings. Pattern: nrf/samples/bluetooth/central_hr_coded.

CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_ASSERT=y

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

# Extended advertising and scanning on the Coded PHY, with S2/S8 coding selection.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y
CONFIG_BT_EXT_ADV_CODING_SELECTION=y

# nRF21540 FEM at maximum gain. The Thingy:53 wires it in GPIO mode (its SPI
# interface is disabled in the board devicetree), so the gain is POUTA = 20 dB,
# selected by MPSL driving MODE low. The controller splits the requested antenna
# power between the SoC and the FEM: 0 dBm from the nRF5340 + 20 dB = +20 dBm.
#
# BENCH ONLY: +20 dBm conducted is at the ETSI EN 300 328 limit of 20 dBm EIRP
# before any antenna gain. alc_drawer_master uses POUTB (+10 dB) for compliance.
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO=y
CONFIG_MPSL_FEM_NRF21540_TX_GAIN_DB=20
CONFIG_BT_CTLR_TX_PWR_ANTENNA=20
