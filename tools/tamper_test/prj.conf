# Anti-tamper button test for the CLASS MFS_1 hardware (first full revision).
#
# GPIO, I2C (nPM2100: boot monitor stop, boost at 3.3 V, supply ADC) and logging.
# No BLE, no settings.

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_GPIO=y

# The DK console UART (uart20) sits on P1.04 / P1.05, which are SCL_1 / SDA_1 to
# the nPM2100 on this board. Keep the UART driver out of the image entirely.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# RTT logging (house style).
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# The nPM2100 boot monitor power-cycles the SoC a few seconds after boot unless the
# host stops it over I2C (see ../../src/app.cpp App::initPmic()).
CONFIG_I2C=y

# Log why the SoC last reset, so a boot-monitor or watchdog reset is visible.
CONFIG_HWINFO=y
