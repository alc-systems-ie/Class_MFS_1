# BENCH ONLY - never in a field device. Leaves the debug port unlocked so RTT
# and a J-Link work without a recover, and logs at every boot:
#     DEBUG PORT UNLOCKED - not for the field!
#
# Add it after the device's conf, e.g. through tools/flash_device.sh <serial> --unlocked,
# or by hand:
#     west build ... -- -DEXTRA_CONF_FILE="<identity conf>;debug-unlocked.conf"
#
# Every other build locks the debug port (prj.conf). Unlocked, anyone with an SWD
# probe can read the image and NVS and run code that uses the KMU keys, so this
# image never leaves the bench. Design 2026-11-15 section 5.4.

CONFIG_NRF_APPROTECT_DISABLE=y
CONFIG_NRF_SECURE_APPROTECT_DISABLE=y
CONFIG_MFS_DEBUG_UNLOCKED=y
