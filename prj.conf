# C++.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# GPIO for the state LEDs, the fire outputs and the sensor interrupts.
CONFIG_GPIO=y

# I2C: nPM2100 PMIC (0x74) on i2c21; ADXL367 (0x1D) and OPT3001 on i2c22.
CONFIG_I2C=y

CONFIG_CLOCK_CONTROL=y

# Logging over RTT (no UART).
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y
# 1 KB (the default) overflows under BLE init plus any periodic logging, and in
# immediate mode the overflow is silent - output simply disappears. Diagnosed
# 2026-08-18 after a whole test cycle produced no usable log.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_MAIN_STACK_SIZE=4096

# BLE — OBSERVER by default: the device scans for one 128-bit service UUID (16
# bytes on air: rotating ID + ciphertext + CCM tag) from the engineer's phone,
# so there is no central role, no GATT and no SMP. See docs/tan-scheme.md
# section 6.1. Legacy scanning is sufficient for this payload.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
# BROADCASTER, not PERIPHERAL: CommandAdvertiser (command_advertiser.cpp) only
# ever calls bt_le_adv_start()/bt_le_adv_stop() for a brief NON-CONNECTABLE
# advertising burst on FIRE (see mfs_protocol Mode::ReportAndTrigger/ReportOnly)
# - there is still no connectable role, no GATT and no SMP, so BT_PERIPHERAL
# (which pulls in BT_CONN) is not needed. Legacy (non-extended) advertising is
# sufficient for one 31-byte AD structure, so CONFIG_BT_EXT_ADV is left at its
# default. Confirmed against Zephyr's bt_le_adv_start()/bt_le_adv_stop(), which
# compile only under CONFIG_BT_BROADCASTER (subsys/bluetooth/host/adv.c), and
# against samples/bluetooth/scan_adv, which combines Broadcaster and Observer
# on one controller - the same combination used here alongside CommandScanner.
# The device is otherwise scan-only: this never solicits contact except on FIRE.
CONFIG_BT_BROADCASTER=y

# nRF21540 FEM (pinout as alc_drawer_master, devicetree node nrf_radio_fem).
# MPSL drives it for every radio event: LNA (+13 dB, 2.9 mA) during each scan
# window, PA on the FIRE confirmation burst, powered down otherwise. POUTB
# (+10 dB) only, for Irish EIRP compliance: the controller splits the requested
# +10 dBm at the antenna into 0 dBm from the SoC plus 10 dB from the FEM. The LNA
# costs ~49 uA average at the 1.675% scan duty, about a year of battery life
# (docs/power-budget.md section 5); without it the device hears commands at
# ~5 m. Making it an app-set option is in docs/todo.md.
CONFIG_MPSL_FEM=y
CONFIG_MPSL_FEM_NRF21540_GPIO_SPI=y
CONFIG_MPSL_FEM_NRF21540_TX_GAIN_DB=10
CONFIG_BT_CTLR_TX_PWR_ANTENNA=10
# RX thread stack. The scan callback deliberately never logs - see the comment
# on s_dropped in command_scanner.cpp, logging on this thread at a rate an
# outsider controls is not safe - so this matches alc_drawer_master's sizing
# rather than the Kconfig default. Dropped-candidate counts are logged later,
# from the main loop, never from this thread.
CONFIG_BT_RX_STACK_SIZE=2048

# Crypto for the day-key scheme: HMAC-SHA256 for key derivation, rotating IDs
# and the time-sync tag; AES-128-CCM with a 4-byte tag for commands.
# Hardware-accelerated via CRACEN on the nRF54L05. See docs/tan-scheme.md.
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# PSA allocates every imported key's buffer from the mbedtls heap, so without
# one psa_import_key() fails with PSA_ERROR_INSUFFICIENT_MEMORY (-141) and the
# boot self-test fails. alc_drawer_master never sets this because NCS implies it
# when Bluetooth host crypto is enabled (nrf/Kconfig.nrf: BT_ECC / BT_CRYPTO,
# pulled in by its peripheral + SMP role). MFS_1 is observer-only, so nothing
# implies it here and it must be explicit - as alc_hub does. Diagnosed
# 2026-09-14 on first boot of the day-key firmware. Keys are imported, used and
# destroyed one at a time (32-byte HMAC, 16-byte AES), so 2 KB is ample headroom.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=2048

# NVS / Settings for the persistent state: the access state (day index + next
# sequence number per slot - AccessState, src/access_control.hpp) and the
# engineer settings record. See docs/tan-scheme.md section 6.2 — day keys
# expire at the 04:00 boundary, so no per-day history is kept.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Bench default: log detection transitions. Logging only - the LEDs are the same
# in every build. Production: n.
CONFIG_MFS_DEBUG_DETECTION_LOG=y
# Bench diagnostic: scan reception counts and discarded command IDs. Production: n.
CONFIG_MFS_SCAN_DIAG=n

# Battery-life test mode is OFF, so green shows the disarmed state: steady until
# the time sync, then 500 ms on / 2500 ms off. Armed, every LED is dark.
#
# Green costs ~170-330 uA while flashing (owner-accepted, 2026-11-12, until the
# app's display-status option), and nothing while armed.
#
# For the LED-free measurement build used to obtain the 75 uA / 68 uA figures in
# docs/power-budget.md, set:
#     CONFIG_MFS_BATTERY_TEST=y
#     CONFIG_MFS_BLINK_MS=0
# which keeps green dark. See docs/battery-test.md.
CONFIG_MFS_BATTERY_TEST=n
