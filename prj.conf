# C++.
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# GPIO for the state LEDs and for parking the unused nRF21540 control pins.
CONFIG_GPIO=y

# I2C for the nPM2100 PMIC (0x74) and ADXL367 (0x1D) on the shared i2c21.
CONFIG_I2C=y

CONFIG_CLOCK_CONTROL=y

# Logging over RTT (no UART).
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_MODE_IMMEDIATE=y
# 1 KB (the default) overflows under BLE init plus any periodic logging, and in
# immediate mode the overflow is silent - output simply disappears. Diagnosed
# 2026-08-18 after a whole test cycle produced no usable log.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

CONFIG_MAIN_STACK_SIZE=4096

# BLE — OBSERVER ONLY. v1 never advertises and never connects: the TAN and the
# toggle arrive together in a 5-byte advertising payload from the engineer's
# Android tool, so there is no peripheral role, no central role, no GATT and no
# SMP. See docs/v1-scope.md section 4. Legacy scanning is sufficient — the
# payload is held to 12 bytes and fits a legacy advertisement.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
# The scan callback logs, and logging in immediate mode is stack-hungry. Matches
# alc_drawer_master rather than relying on the default.
CONFIG_BT_RX_STACK_SIZE=2048

# Crypto for HMAC-SHA256 — TAN derivation and provisioner time-sync
# authentication. Hardware-accelerated via CRACEN on the nRF54L05.
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# NVS / Settings for the persistent state: 4-byte TanState (day index +
# consumed mask) and the arm state. See docs/tan-scheme.md section 8.2 —
# because TANs expire by date, no per-day history is kept.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Bench defaults. Production: CONFIG_MFS_DEBUG_LED=n (see Kconfig help — a
# continuously lit LED is ~29x the operating budget).
CONFIG_MFS_DEBUG_LED=y

# BENCH ONLY - unauthenticated toggle. Must be n before this leaves the bench.
CONFIG_MFS_INSECURE_TOGGLE=y

# Battery-life test mode is OFF, so LED A is the arm-state indicator again: ON
# when deactivated, off when active. Activation/deactivation is hard to confirm
# without it.
#
# This costs nothing in normal operation, because a deployed device is ACTIVE and
# LED A is then off. It only draws (~2 mA) while sitting deactivated on the bench.
#
# For the LED-free measurement build used to obtain the 75 uA / 68 uA figures in
# docs/power-budget.md, set:
#     CONFIG_MFS_BATTERY_TEST=y
#     CONFIG_MFS_BLINK_MS=0
# which stops LED A being driven at all. See docs/battery-test.md.
CONFIG_MFS_BATTERY_TEST=n
